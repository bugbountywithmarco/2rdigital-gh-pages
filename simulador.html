<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulador de Consórcio, 2R</title>
<style>
:root {
  --bg-deep: #060e16;
  --bg-mid:  #091929;
  --bg-glow: #0d2a40;
  --cyan:    #00e6ff;
  --green:   #3ddc97;
  --orange:  #e87722;
  --amber:   #f59e0b;
  --text:    #f0f6fb;
  --soft:    #d4e2ed;
  --muted:   #9ab0c0;
  --border:  #1e4060;
  --card-bg: rgba(12,30,48,0.95);
  --radius:  18px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

#app {
  width: 100%;
  max-width: 940px;
  margin: 0 auto;
  padding: 40px 20px 80px;
}

/* ── Progress ── */
.progress {
  display: flex; align-items: flex-start; gap: 6px; margin-bottom: 40px;
}
.step-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.step-dot {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; transition: all .2s;
  border: 2px solid var(--border);
}
.step-dot.active  { background: linear-gradient(135deg,#1d5a85,var(--cyan)); border-color: var(--cyan); color: #fff; }
.step-dot.done    { background: var(--green); border-color: var(--green); color: #000; }
.step-dot.pending { background: transparent; color: var(--muted); }
.step-label { font-size: 10px; color: var(--muted); text-align: center; white-space: nowrap; }
.step-line  { flex: 1; height: 2px; background: var(--border); border-radius: 2px; margin-top: 16px; }
.step-line.done { background: var(--green); }

/* ── Cards ── */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 16px;
  box-shadow: 0 18px 40px rgba(0,0,0,.5);
}

h1 { font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 10px; line-height: 1.2; }
h2 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 8px; }
.subtitle { font-size: 16px; color: var(--soft); margin-bottom: 24px; line-height: 1.6; }
.kicker {
  text-transform: uppercase; letter-spacing: .14em; font-size: 12px;
  color: var(--cyan); margin-bottom: 8px;
}

/* ── Tipo buttons ── */
.tipo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
.tipo-btn {
  padding: 18px 14px; border: 2px solid var(--border); border-radius: 14px;
  background: var(--card-bg); cursor: pointer; text-align: center; transition: all .15s;
  color: var(--soft);
}
.tipo-btn .tipo-icon { font-size: 30px; display: block; margin-bottom: 8px; }
.tipo-btn .tipo-label { font-size: 15px; font-weight: 600; }
.tipo-btn.selected { border-color: var(--cyan); background: rgba(0,230,255,.07); color: #fff; }
.tipo-btn:hover:not(.selected) { border-color: rgba(0,230,255,.35); }

/* ── Slider ── */
.slider-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.slider-label span { font-size: 13px; color: var(--muted); }
.slider-value { font-size: 36px; font-weight: 700; color: var(--cyan); margin-bottom: 12px; }
input[type=range] {
  -webkit-appearance: none; width: 100%; height: 5px;
  border-radius: 3px; background: var(--border); outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 24px; height: 24px;
  border-radius: 50%; background: linear-gradient(135deg,#1d5a85,var(--cyan)); cursor: pointer;
  box-shadow: 0 0 12px rgba(0,230,255,.4);
}
.slider-range { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }

/* ── Cenários grid ── */
.cenarios-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.cenario-card {
  border: 2px solid var(--border); border-radius: var(--radius); padding: 20px;
  cursor: pointer; transition: all .15s; position: relative;
  background: rgba(14,36,56,.7);
}
.cenario-card:hover  { border-color: rgba(0,230,255,.4); box-shadow: 0 0 20px rgba(0,230,255,.08); }
.cenario-card.selected { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,230,255,.15); }
.cenario-card.destaque { border-color: rgba(0,230,255,.5); }

.badge-recomendado {
  position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg,#1d5a85,var(--cyan)); color: #fff;
  font-size: 10px; font-weight: 700; padding: 3px 12px; border-radius: 99px; white-space: nowrap;
}
.badge-campanha {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(248,163,23,.12); color: var(--amber); font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 99px; border: 1px solid rgba(248,163,23,.3); margin-bottom: 10px;
}

.cenario-nome { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 6px; }
.cenario-desc { font-size: 13px; color: var(--soft); margin-bottom: 14px; line-height: 1.4; margin-top: 4px; }

/* Tipo lance badge */
.tipo-lance-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 600; padding: 2px 8px;
  border-radius: 99px; cursor: pointer; user-select: none;
}
.tl-livre    { background: rgba(248,163,23,.12); color: #fbbf24; border: 1px solid rgba(248,163,23,.3); }
.tl-fixo     { background: rgba(139,92,246,.12);  color: #a78bfa; border: 1px solid rgba(139,92,246,.3); }
.tl-sorteio  { background: rgba(0,230,255,.1);  color: var(--cyan); border: 1px solid rgba(0,230,255,.3); }
.tl-embutido { background: rgba(61,220,151,.1);  color: var(--green); border: 1px solid rgba(61,220,151,.3); }

.explicacao-box {
  margin-top: 8px; padding: 10px 12px;
  background: rgba(0,100,180,.1); border: 1px solid rgba(0,230,255,.2); border-radius: 10px;
  font-size: 12px; color: var(--soft); line-height: 1.5; display: none;
}
.explicacao-box.aberta { display: block; }

/* Divider */
.divider { height: 1px; background: var(--border); margin: 12px 0; }

/* Parcela */
.parcela-row { margin-bottom: 10px; }
.parcela-sem { font-size: 13px; color: var(--muted); text-decoration: line-through; }
.parcela-com { font-size: 28px; font-weight: 700; color: var(--green); line-height: 1.1; }
.parcela-label { font-size: 11px; color: var(--soft); }

.info-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 6px; }
.info-label { color: var(--soft); }
.info-val { font-weight: 600; color: var(--text); }

.prazo-row { font-size: 12px; color: var(--soft); margin-top: 10px; }
.prazo-row strong { color: var(--cyan); }

.caso-item { display: flex; gap: 5px; font-size: 12px; color: var(--soft); margin-top: 5px; line-height: 1.4; }
.caso-item::before { content: '✓'; color: var(--green); font-weight: 700; flex-shrink: 0; }

/* Botão escolher dentro do card */
.btn-escolher {
  width: 100%; margin-top: 14px; padding: 9px;
  border: 1.5px solid var(--border); border-radius: 99px;
  background: transparent; color: var(--soft); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s;
}
.btn-escolher:hover { border-color: var(--cyan); color: var(--cyan); }
.btn-escolher.escolhido {
  border-color: var(--green); color: var(--green);
  background: rgba(61,220,151,.08);
}

/* Lance alternativo */
.btn-lance-alto {
  background: none; border: none; color: var(--cyan);
  font-size: 11px; cursor: pointer; padding: 0; margin-top: 10px;
  text-decoration: underline; text-underline-offset: 2px; display: block; text-align: left;
}
.alternativo-box {
  margin-top: 10px; padding: 10px 12px;
  background: rgba(0,230,255,.05); border: 1px solid rgba(0,230,255,.2); border-radius: 10px;
}
.alternativo-titulo { font-size: 11px; font-weight: 700; color: var(--cyan); margin-bottom: 6px; }
.alternativo-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
.alternativo-label { color: var(--muted); }
.alternativo-val { font-weight: 600; }
.alternativo-val.green { color: var(--green); }
.alternativo-val.up    { color: var(--amber); }
.alternativo-nota { font-size: 10px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.btn-usar-alternativo {
  background: none; border: 1px solid var(--cyan); color: var(--cyan);
  border-radius: 99px; font-size: 10px; font-weight: 700; cursor: pointer;
  padding: 4px 12px; margin-top: 8px; transition: all .15s;
}
.btn-usar-alternativo:hover { background: rgba(0,230,255,.1); }

/* ── Porto Seguro co-brand ── */
.porto-strip {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 8px 16px; margin-bottom: 20px;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px; font-size: 12px; color: var(--muted);
}
.porto-strip img { height: 56px; background: #fff; border-radius: 8px; padding: 2px 8px; }
.porto-strip .porto-sep { width: 1px; height: 16px; background: var(--border); }

/* ── Campanha banner animado ── */
@keyframes pulse-border {
  0%, 100% { box-shadow: 0 0 0 0 rgba(248,163,23,.4), 0 0 24px rgba(248,163,23,.12); }
  50%       { box-shadow: 0 0 0 4px rgba(248,163,23,.12), 0 0 32px rgba(248,163,23,.22); }
}
@keyframes badge-pop {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.08); }
  100% { transform: scale(1); }
}
.campanha-banner {
  background: linear-gradient(135deg, rgba(248,163,23,.1) 0%, rgba(232,119,34,.06) 100%);
  border: 1px solid rgba(248,163,23,.4);
  border-radius: 16px; padding: 16px 18px; margin-bottom: 20px;
  animation: pulse-border 2.8s ease-in-out infinite;
  position: relative; overflow: hidden;
}
.campanha-banner::before {
  content: '';
  position: absolute; top: 0; left: -60%;
  width: 40%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.04), transparent);
  animation: shimmer 3s ease-in-out infinite;
}
@keyframes shimmer {
  0%   { left: -60%; }
  100% { left: 130%; }
}
.campanha-top {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
}
.campanha-porto-logo {
  display: flex; align-items: center; gap: 8px;
}
.campanha-porto-logo img {
  height: 64px; background: #fff; border-radius: 10px; padding: 2px 10px;
}
.campanha-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(248,163,23,.18); color: var(--amber);
  font-size: 10px; font-weight: 800; padding: 3px 10px;
  border-radius: 99px; border: 1px solid rgba(248,163,23,.4);
  text-transform: uppercase; letter-spacing: .08em;
  animation: badge-pop 2.8s ease-in-out infinite;
}
.campanha-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 4px; }
.campanha-desc  { font-size: 12px; color: var(--soft); line-height: 1.5; }
.campanha-vigencia {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--amber); font-weight: 700; margin-top: 8px;
  background: rgba(248,163,23,.1); padding: 3px 10px; border-radius: 99px;
}

/* Nota estimativa */
.nota-estimativa {
  font-size: 11px; color: var(--muted); margin-top: 16px;
  padding: 10px 14px; background: rgba(0,0,0,.3);
  border-radius: 10px; border: 1px solid var(--border); line-height: 1.5;
}

/* Buttons */
.btn-primary {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 15px;
  background: linear-gradient(135deg, #1d5a85, var(--cyan));
  color: #fff; border: none; border-radius: 99px;
  font-size: 16px; font-weight: 700; cursor: pointer; transition: all .15s;
  box-shadow: 0 0 22px rgba(0,230,255,.2);
}
.btn-primary:hover:not(:disabled) { box-shadow: 0 0 30px rgba(0,230,255,.35); transform: translateY(-1px); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

.btn-secondary {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 13px;
  background: transparent; color: var(--cyan);
  border: 1.5px solid var(--cyan); border-radius: 99px;
  font-size: 15px; font-weight: 600; cursor: pointer; transition: all .15s; margin-top: 10px;
  text-decoration: none;
}
.btn-secondary:hover { background: rgba(0,230,255,.07); }

.btn-wpp {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px;
  background: #25d366; color: #fff; border: none; border-radius: 99px;
  font-size: 15px; font-weight: 700; cursor: pointer; transition: all .15s; margin-top: 10px;
  text-decoration: none;
}
.btn-wpp:hover { background: #1ebe5d; transform: translateY(-1px); }

.btn-back {
  background: none; border: none; color: var(--muted); font-size: 13px;
  cursor: pointer; padding: 0; margin-bottom: 20px;
  display: flex; align-items: center; gap: 4px;
}
.btn-back:hover { color: var(--cyan); }

/* Intenção */
.intencao-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.intencao-btn {
  padding: 13px 12px; border: 1.5px solid var(--border); border-radius: 12px;
  background: var(--card-bg); cursor: pointer; text-align: left; transition: all .15s; color: var(--text);
}
.intencao-btn .i-label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 3px; color: #fff; }
.intencao-btn .i-desc  { font-size: 11px; color: var(--muted); line-height: 1.3; }
.intencao-btn.selected { border-color: var(--cyan); background: rgba(0,230,255,.07); }
.intencao-btn:hover:not(.selected) { border-color: rgba(0,230,255,.3); }

/* Form */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--soft); }
.form-group input,
.form-group textarea {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--border); border-radius: 10px;
  background: rgba(0,0,0,.3); color: var(--text); font-size: 15px; outline: none;
  transition: border .15s; font-family: inherit;
}
.form-group input:focus,
.form-group textarea:focus { border-color: var(--cyan); }
.form-group input::placeholder,
.form-group textarea::placeholder { color: var(--muted); }
.form-group textarea { resize: vertical; }

/* Resumo */
.resumo-box {
  background: rgba(0,230,255,.05); border: 1px solid rgba(0,230,255,.2); border-radius: 12px;
  padding: 16px; margin-bottom: 20px;
}
.resumo-titulo { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
.resumo-cenario { font-size: 16px; font-weight: 700; color: #fff; }
.resumo-valores { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
.resumo-item-label { font-size: 11px; color: var(--muted); }
.resumo-item-val   { font-size: 17px; font-weight: 700; color: #fff; }
.resumo-item-val.green { color: var(--green); }

/* Divider */
.ou-divider {
  display: flex; align-items: center; gap: 10px;
  color: var(--muted); font-size: 12px; margin: 14px 0;
}
.ou-divider::before, .ou-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* Sucesso */
.sucesso { text-align: center; padding: 20px 0; }
.sucesso-icon { font-size: 60px; margin-bottom: 16px; }

/* Legal */
.legal { font-size: 10px; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.5; }

/* ── Contratação online ── */
.secao-titulo {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  color: var(--cyan); margin: 20px 0 12px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fields-grid .full { grid-column: 1 / -1; }
.tipo-pessoa-toggle {
  display: flex; gap: 8px; margin-bottom: 20px;
}
.tp-btn {
  flex: 1; padding: 10px; border: 1.5px solid var(--border); border-radius: 10px;
  background: transparent; color: var(--soft); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .15s; text-align: center;
}
.tp-btn.active { border-color: var(--cyan); background: rgba(0,230,255,.07); color: #fff; }
@keyframes highlight-pulse {
  0%, 100% { border-color: var(--border); }
  50% { border-color: var(--green); box-shadow: 0 0 0 3px rgba(61,220,151,.25); }
}
.input-highlight { animation: highlight-pulse .4s ease-in-out 3; }

.skip-link {
  display: block; text-align: center; color: var(--muted); font-size: 12px;
  margin-top: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}
.skip-link:hover { color: var(--cyan); }

/* Mobile */
@media (max-width: 700px) {
  #app { padding: 24px 14px 60px; }
  .cenarios-grid { grid-template-columns: 1fr; }
  .intencao-grid { grid-template-columns: 1fr; }
  .tipo-grid { grid-template-columns: 1fr 1fr; }
  h1 { font-size: 22px; }
  h2 { font-size: 18px; }
  .slider-value { font-size: 28px; }
  .card { padding: 20px 16px; }
  .resumo-valores { gap: 14px; }
  .parcela-com { font-size: 22px; }
  .step-label { display: none; }
}
</style>
</head>

<script>

/* Advanced matching da Meta (CAPI): telefone com hash SHA-256 + external_id.
   O container server lê eventModel.user_data; mandamos o telefone já hasheado
   (privacidade) e o visitor_id como external_id. */
async function sha256Hex(s) {
  if (!s || !(window.crypto && crypto.subtle)) return null;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return null; }
}
function normPhoneBR(t) {
  let d = (t || '').replace(/\D/g, '');
  if (!d) return null;
  if (d.length <= 11 && d[0] !== '5') d = '55' + d; // adiciona DDI do Brasil se faltar
  return d;
}
async function buildUserData() {
  const ud = {};
  const ph = await sha256Hex(normPhoneBR(state.telefone));
  if (ph) ud.ph = [ph];
  if (UTM.visitor_id) ud.external_id = UTM.visitor_id;
  return Object.keys(ud).length ? ud : undefined;
}

}

/* ── Formatação ── */
function fmt(v) {
  return 'R$ ' + Math.round(v).toLocaleString('pt-BR');
}
function fmtMeses(min, max) {
  if (min === 0 && max === 0) return 'Sem estimativa';
  if (min === max) return `~${min} ${min === 1 ? 'mês' : 'meses'}`;
  return `${min}–${max} meses`;
}
function fmtDate(d) {
  if (!d) return '';
  const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`;
}

/* ── Motor de cálculo ── */
function calcular(valor, config, cenario) {
  const n           = cenario.installment_count;
  const admFee      = cenario.admin_fee / 100;
  const reserva     = config.reserve_fund / 100;
  const prestamista = config.borrower_insurance / 100;
  const redutor     = config.installment_discount / 100;
  const embutidoPct = cenario.use_embedded_bid ? cenario.embedded_bid_pct / 100 : 0;
  const lanceTotalP = cenario.total_bid_pct / 100;

  const carta           = cenario.use_embedded_bid ? valor / (1 - embutidoPct) : valor;
  const total_a_pagar   = carta * (1 + admFee + reserva);
  const parcela_base    = total_a_pagar / n;
  const parcela_sem     = Math.round(parcela_base + prestamista * total_a_pagar);
  const parcela_com     = Math.round(parcela_base * (1 - redutor) + prestamista * total_a_pagar);
  const embutido_valor  = cenario.use_embedded_bid ? Math.round(carta * embutidoPct) : 0;
  const lance_total     = Math.round((1 + admFee + reserva) * carta * lanceTotalP);
  const lance_proprio   = Math.max(0, lance_total - embutido_valor);

  return { carta: Math.round(carta), parcela_sem, parcela_com, embutido_valor, lance_proprio };
}

/* ── WPP URL ── */
function buildWppUrl() {
  const num = state.config?.whatsapp_numero;
  if (!num) return null;
  const c = state.cenarioSelecionado;
  const altAberto = c ? (state.alternativoAberto[c.id] ?? false) : false;
  const intObj = INTENCOES.find(i => i.value === state.intencao);
  const lines = [
    'Olá! Simulei um consórcio no site da 2R Consórcio.',
    `*Tipo:* ${state.tipo}`,
    `*Valor:* ${fmt(state.valor)}`,
    c ? `*Cenário:* ${c.nome}${altAberto && c.use_embedded_bid ? ' (com lance embutido)' : ''}` : null,
    intObj ? `*Interesse:* ${intObj.label}` : null,
    state.mensagem.trim() ? `*Mensagem:* ${state.mensagem.trim()}` : null,
  ].filter(Boolean).join('\n');
  return `https://wa.me/${num}?text=${encodeURIComponent(lines)}`;
}

/* ── API ── */
async function loadConfig() {
  state.loading = true; render();
  try {
    const r = await fetch(`${FUNCTION_URL}?tipo=${encodeURIComponent(state.tipo)}&valor=${state.valor}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    state.config   = d.config ?? null;
    state.cenarios = d.cenarios ?? [];
    state.cenarioSelecionado = null;
    state.alternativoAberto = {};
    state.error = null;
    if (state.cenarios.length) fstep('cenarios_vistos');
  } catch (e) { state.error = 'Erro ao carregar. Tente novamente.'; }
  finally { state.loading = false; render(); }
}

async function submitLead(nextStep = 4) {
  if (!state.nome.trim() || !state.telefone.trim() || !state.intencao) return;
  state.submitting = true; render();
  try {
    const c = state.cenarioSelecionado;
    const altAberto = c ? (state.alternativoAberto[c.id] ?? false) : false;
    const res = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nome: state.nome.trim(),
        telefone: state.telefone.trim(),
        tipo: state.tipo,
        valor: state.valor,
        cenario_id: c?.id,
        cenario_nome: c?.nome,
        usa_embutido: altAberto && c?.use_embedded_bid,
        intencao: state.intencao,
        mensagem: state.mensagem.trim() || null,
        ...UTM,
      }),
    });
    const resData = await res.json().catch(() => ({}));
    state.lead_id = resData.lead_id ?? null;
    fstep('lead_enviado');
    // Evento de conversão: nome padrão GA4 (o GTM mapeia generate_lead -> Lead
    // da Meta) e value/currency dentro de eventModel (formato que as variáveis
    // do setup de Conversions API leem). user_data melhora o match na CAPI.
    const user_data = await buildUserData();
    trackEvent('generate_lead', {
      eventModel: {
        currency: 'BRL',
        value: state.valor,
        tipo: state.tipo,
        intencao: state.intencao,
        cenario: state.cenarioSelecionado?.nome ?? '',
        origem: UTM.origem,
        utm_source: UTM.utm_source,
        utm_campaign: UTM.utm_campaign,
        ...(user_data ? { user_data } : {}),
      },
    });
    state.step = nextStep;
  } catch {}
  finally { state.submitting = false; render(); }
}

async function submitAndGoForm() {
  if (!state.nome.trim()) {
    const el = document.getElementById('input-nome');
    el?.focus(); el?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el?.classList.add('input-highlight');
    setTimeout(() => el?.classList.remove('input-highlight'), 1200);
    return;
  }
  if (!state.telefone.trim()) {
    const el = document.getElementById('input-tel');
    el?.focus(); el?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el?.classList.add('input-highlight');
    setTimeout(() => el?.classList.remove('input-highlight'), 1200);
    return;
  }
  await submitLead(5);
}

    setTimeout(() => el?.classList.remove('input-highlight'), 1600);
    if (hint) { hint.textContent = msg; hint.style.display = 'block'; }
  };
  if (!state.nome.trim())     return warn('input-nome', 'Preencha seu nome para continuar.');
  if (!state.telefone.trim()) return warn('input-tel', 'Preencha seu WhatsApp para continuar.');
  if (hint) { hint.textContent = ''; hint.style.display = 'none'; }
  const wppUrl = buildWppUrl();
  if (!wppUrl) return;
  // Salva lead no CRM antes de abrir o WhatsApp
  await submitLead(state.step);
  window.open(wppUrl, '_blank', 'noopener');
}

/* ── Ações ── */
function selectTipo(v) {
  state.tipo = v;
  state.valor = TIPOS.find(t => t.value === v).def;
  render();
}
function updateValor(v) {
  state.valor = parseInt(v);
  const el = document.querySelector('.slider-value');
  if (el) el.textContent = fmt(state.valor);
  // no render, just update display inline
}
function selectCenario(id) {
  state.cenarioSelecionado = state.cenarios.find(c => c.id === id) ?? null;
  render();
}
function escolherCenario(id) {
  state.cenarioSelecionado = state.cenarios.find(c => c.id === id) ?? null;
  trackEvent('cenario_selecionado', {
    tipo: state.tipo,
    valor: state.valor,
    cenario: state.cenarioSelecionado?.nome ?? '',
  });
  state.step = 3;
  render();
}
function toggleAlternativo(id) {
  state.alternativoAberto = { ...state.alternativoAberto, [id]: !state.alternativoAberto[id] };
  render();
}
function toggleExplicacao(id) {
  state.explicacaoAberta = state.explicacaoAberta === id ? null : id;
  render();
}

function checkSubmit() {
  const btn = document.getElementById('btn-submit');
  if (!btn) return;
  const ok = state.nome.trim() && state.telefone.trim() && state.intencao && !state.submitting;
  btn.disabled = !ok;
  btn.textContent = state.submitting
    ? 'Enviando...'
    : !state.intencao
    ? 'Selecione uma opção acima'
    : 'Quero ser contatado pelo WhatsApp';
}
function usarAlternativo(id, pct) {
  const base = state.cenarios.find(c => c.id === id);
  if (!base) return;
  state.cenarioSelecionado = { ...base, nome: base.nome + ' (com embutido)', use_embedded_bid: true, embedded_bid_pct: pct };
  state.alternativoAberto = { [id]: true };
  state.step = 3;
  render();
}
async function goStep2() {
  state.step = 2;
  await loadConfig();
}
function toggleEditarValor() {
  state.editandoValor = !state.editandoValor;
  render();
}
async function aplicarNovoValor() {
  state.editandoValor = false;
  await loadConfig();
}

/* ── Render helpers ── */
function renderProgress() {
  const steps = state.intencao === 'contratar_agora' && state.step >= 4
    ? ['Objetivo', 'Cenários', 'Contato', 'Contrato']
    : ['Objetivo', 'Cenários', 'Contato'];
  const s = Math.min(state.step, steps.length + 1);
  return `<div class="progress">
    ${steps.map((label, i) => {
      const n = i + 1;
      const cls = n < s ? 'done' : n === s ? 'active' : 'pending';
      const line = i < steps.length - 1
        ? `<div class="step-line ${n < s ? 'done' : ''}"></div>`
        : '';
      return `<div class="step-wrap">
        <div class="step-dot ${cls}">${n < s ? '✓' : n}</div>
        <div class="step-label">${label}</div>
      </div>${line}`;
    }).join('')}
  </div>`;
}

function renderTipoLance(tipo, cenarioId, useEmbutido, embutidoPct) {
  const t = TIPO_LANCE[tipo] ?? TIPO_LANCE['lance_fixo'];
  const aberta = state.explicacaoAberta === cenarioId;
  const embutidoTag = useEmbutido
    ? `<span class="tipo-lance-badge tl-embutido" style="margin-left:4px;cursor:default">💳 embutido ${embutidoPct}%</span>`
    : '';
  const explicacaoContent = useEmbutido
    ? `${t.desc}<br/><br/>${EMBUTIDO_INFO}`
    : t.desc;
  return `<div onclick="event.stopPropagation()">
    <span class="tipo-lance-badge ${t.cls}" onclick="toggleExplicacao('${cenarioId}')">${t.label} ℹ️</span>${embutidoTag}
    <div class="explicacao-box ${aberta ? 'aberta' : ''}">
      <strong style="color:${t.cls === 'tl-livre' ? '#fbbf24' : t.cls === 'tl-fixo' ? '#a78bfa' : 'var(--cyan)'}">${t.titulo}</strong><br/>
      ${explicacaoContent}
    </div>
  </div>`;
}

function buildContratoWppUrl() {
  const num = state.config?.whatsapp_numero;
  if (!num) return null;
  const c = state.cenarioSelecionado;
  const tipo = state.tipo;
  const valor = fmt(state.valor);
  const lines = [
    `Olá! Acabei de simular um consórcio de ${tipo} de ${valor} no site da 2R e quero iniciar a contratação.`,
    c ? `Cenário escolhido: ${c.nome}` : null,
  ].filter(Boolean).join('\n');
  return `https://wa.me/${num}?text=${encodeURIComponent(lines)}`;
}

function renderStep4() {
  const isContratarAgora = state.intencao === 'contratar_agora';
  const contratoWppUrl = buildContratoWppUrl();

  if (isContratarAgora) {
    return `
    <div class="card">

        <div style="font-size:48px;margin-bottom:12px">✅</div>
        <h2 style="color:var(--green)">Dados recebidos, ${state.nome.split(' ')[0]}!</h2>
        <p style="color:var(--soft);margin-top:8px;font-size:14px">Como prefere prosseguir com a contratação?</p>

        📋 Preencher dados online agora

      ${contratoWppUrl ? `
      <div class="ou-divider">ou</div>

        ${WPP_SVG} Contratar pelo WhatsApp
      </a>` : ''}

      <p class="legal" style="margin-top:16px">Não se preocupe, um especialista vai acompanhar o processo e entrar em contato.</p>
    </div>`;
  }

  return `
    <div class="card sucesso">
      <div class="sucesso-icon">🎉</div>
      <h2 style="color:var(--green)">Tudo certo, ${state.nome.split(' ')[0]}!</h2>
      <p style="color:var(--soft);margin-top:10px;line-height:1.6">
        Recebemos sua simulação e em breve um especialista da 2R vai entrar em contato pelo WhatsApp.
      </p>
      <p style="margin-top:16px;font-size:13px;color:var(--muted)">
        Enquanto isso, aproveite para <a href="/" style="color:var(--cyan)">conhecer mais sobre consórcio</a>.
      </p>
    </div>`;
}

function field(id, label, placeholder, type='text', required=false, fullWidth=false) {
  const val = state.dadosContrato[id] ?? '';
  return `<div class="form-group ${fullWidth ? 'full' : ''}">
    <label>${label}${required ? ' <span style="color:#f87171">*</span>' : ''}</label>
    <input type="${type}" placeholder="${placeholder}" value="${val}"
      oninput="state.dadosContrato['${id}']=this.value" />
  </div>`;
}

async function submitContrato() {
  if (!state.lead_id) { alert('Erro: lead não encontrado. Recarregue a página.'); return; }
  state.submittingContrato = true; render();
  try {
    await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'proposta',
        lead_id: state.lead_id,
        tipo_pessoa: state.tipoPessoa,
        dados: state.dadosContrato,
      }),
    });
    trackEvent('proposta_enviada', {
      tipo: state.tipo,
      valor: state.valor,
      tipo_pessoa: state.tipoPessoa,
      currency: 'BRL',
      value: state.valor,
    });
    state.step = 6;
  } catch {}
  finally { state.submittingContrato = false; render(); }
}

  const contratoWppUrl = buildContratoWppUrl();

        ${WPP_SVG} Falar com especialista agora
      </a>` : ''}
    </div>`;
}

let _lastStep = 1;
function render(scrollTop = true) {
  let html = renderProgress();
  if      (state.step === 1) html += renderStep1();
  else if (state.step === 2) html += renderStep2();
  else if (state.step === 3) html += renderStep3();
  else if (state.step === 4) html += renderStep4();
  else if (state.step === 5) html += renderStep5();
  else                       html += renderStep6();
  document.getElementById('root').innerHTML = html;
  if (scrollTop && state.step !== _lastStep) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  _lastStep = state.step;
}

render();
fstep('simulador_abriu');
</script>
